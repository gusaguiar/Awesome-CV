# Configuracao Nginx para servir o site estatico do Astro.
# Otimizada para:
#   - Compressao gzip nos tipos textuais
#   - Cache agressivo dos assets versionados pelo Astro (/_astro/*)
#   - Roteamento amigavel para paginas .html geradas estaticamente

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Esconde a versao do Nginx nos headers de resposta
    server_tokens off;

    # ----- Compressao -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ----- Cache de assets versionados -----
    # O Astro gera nomes com hash em /_astro/, entao podemos cachear por 1 ano.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Fontes e imagens tambem podem ser cacheadas por longos periodos
    location ~* \.(?:woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ----- Roteamento -----
    # try_files cobre URLs com e sem barra final, e serve o .html correspondente.
    # Como o site e totalmente estatico (output: 'static'), nao ha SPA fallback.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Pagina de erro padrao
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
